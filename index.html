<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1420" />
    <title>Les Racines Creuses</title>
    <meta
      name="description"
      content="Un action-RPG 2D où une jeune cartographe tente de rendre l'eau à la Vallée de Bruyère."
    />
  </head>
  <body>
    <main class="game-shell">
      <div id="game-frame" class="game-frame">
        <canvas id="game" width="384" height="216" aria-label="Jeu Les Racines Creuses" tabindex="0"></canvas>
      </div>
      <p class="controls">
        <span><kbd>↑↓←→</kbd> marcher</span>
        <span><kbd>Espace</kbd> épée</span>
        <span><kbd>Maj</kbd> esquive</span>
        <span><kbd>X</kbd> agir</span>
        <span><kbd>C</kbd> objet</span>
        <span><kbd>F</kbd> démon</span>
        <span><kbd>Entrée</kbd> menu</span>
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
