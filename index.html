<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#142b2b" />
    <title>Les Racines Creuses</title>
    <meta
      name="description"
      content="Un action-RPG 2D où une jeune cartographe tente de rendre l'eau à la Vallée de Bruyère."
    />
  </head>
  <body>
    <main class="game-shell">
      <section class="title-card" aria-label="Titre du jeu">
        <span class="kicker">UN CONTE DE LA VALLÉE DE BRUYÈRE</span>
        <h1>Les Racines Creuses</h1>
      </section>
      <div id="game-frame" class="game-frame">
        <canvas id="game" width="256" height="224" aria-label="Jeu Les Racines Creuses" tabindex="0"></canvas>
      </div>
      <p class="controls">
        <span><kbd>↑↓←→</kbd> bouger</span>
        <span><kbd>X</kbd> parler / agir</span>
        <span><kbd>Espace</kbd> épée</span>
        <span><kbd>Maj</kbd> forme démon</span>
        <span><kbd>C</kbd> objet</span>
        <span><kbd>Entrée</kbd> menu</span>
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
